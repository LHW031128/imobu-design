<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이모부 · 화면 보기</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Pretendard Variable";src:url(assets/fonts/PretendardVariable.woff2) format("woff2-variations"),url(assets/fonts/PretendardVariable.woff2) format("woff2");font-weight:45 920;font-style:normal;font-display:swap}
:root{--accent:#1219f7;--ink:#15181e;--sub:#5b6370;--faint:#8a919c;--line:#e2e5ea;--bg:#f5f6f8;--card:#ffffff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg);word-break:keep-all;-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:15px;text-decoration:none}
.brand img{width:26px;height:26px;display:block}
.ghlink{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;text-decoration:none;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.ghlink:hover{border-color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

body{background:#e9ecf0}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;height:60px;padding:0 16px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.back{flex:0 0 auto;font-size:13.5px;font-weight:600;text-decoration:none;padding:8px 10px;border-radius:8px}
.back:hover{background:var(--bg)}
.info{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.grp{font-size:11.5px;font-weight:700;color:var(--accent)}
.ttl{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl{flex:0 0 auto;display:flex;align-items:center;gap:6px}
.count{font-size:12px;color:var(--faint);margin-right:4px;font-variant-numeric:tabular-nums}
.ctrl button,.ctrl a{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;cursor:pointer}
.ctrl button:hover,.ctrl a:hover{border-color:var(--ink)}
.ctrl button:disabled{opacity:.35;cursor:default;border-color:var(--line)}
.stage{display:flex;justify-content:center;padding:28px 16px 64px}
.frame{position:relative;overflow:hidden;background:#fff;box-shadow:0 16px 48px rgba(21,24,30,.14)}
.frame iframe{position:absolute;left:0;top:0;border:0;display:block;transform-origin:0 0;background:#fff}
.hint{text-align:center;font-size:12px;color:var(--faint);margin:-40px 0 40px}
@media (max-width:620px){.ctrl .count,.ctrl .open{display:none}.bar{gap:8px;padding:0 10px}.back{padding:8px 6px}.hint{display:none}}
</style>
</head>
<body>
<header class="bar">
<a class="back" href="./">← 전체 화면</a>
<div class="info"><span class="grp"></span><strong class="ttl"></strong></div>
<div class="ctrl"><span class="count"></span><button type="button" class="prev" aria-label="이전 화면">‹</button><button type="button" class="next" aria-label="다음 화면">›</button><a class="open" target="_blank" rel="noopener">새 탭</a></div>
</header>
<main class="stage"><div class="frame"><iframe title="디자인 화면"></iframe></div></main>
<p class="hint">화면 안의 버튼과 메뉴를 누르면 연결된 화면으로 이동해요 · 키보드 ← → 로 순서대로 넘겨 볼 수 있어요</p>

const byId = {}; SCREENS.forEach((s, i) => { s.i = i; byId[s.id] = s; });
const frame = document.querySelector('.frame'), ifr = document.querySelector('iframe');
const grp = document.querySelector('.grp'), ttl = document.querySelector('.ttl'), count = document.querySelector('.count');
const prev = document.querySelector('.prev'), next = document.querySelector('.next'), open = document.querySelector('.open');
let cur = null;
const idOf = (href) => { const m = /\/screens\/([^\/?#]+)\.html/.exec(href || ''); return m ? decodeURIComponent(m[1]) : null; };
function fit() {
  if (!cur) return;
  const avail = Math.max(240, document.querySelector('.stage').clientWidth - 32);
  const k = Math.min(1, avail / cur.w);
  ifr.style.width = cur.w + 'px'; ifr.style.height = cur.h + 'px'; ifr.style.transform = 'scale(' + k + ')';
  frame.style.width = Math.round(cur.w * k) + 'px'; frame.style.height = Math.round(cur.h * k) + 'px';
  frame.style.borderRadius = (cur.r ? Math.round(cur.r * k) : 6) + 'px';
}
function show(id, fromFrame) {
  const s = byId[id] || SCREENS[0];
  cur = s;
  grp.textContent = s.g; ttl.textContent = s.t;
  count.textContent = (s.i + 1) + ' / ' + SCREENS.length;
  prev.disabled = s.i === 0; next.disabled = s.i === SCREENS.length - 1;
  open.href = 'screens/' + encodeURIComponent(s.id) + '.html';
  document.title = s.t + ' · 이모부';
  history.replaceState(null, '', '?s=' + encodeURIComponent(s.id));
  if (!fromFrame) ifr.src = 'screens/' + encodeURIComponent(s.id) + '.html';
  fit();
}
function onKey(e) {
  if (e.target && e.target.closest && e.target.closest('input,textarea,select,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') prev.click();
  if (e.key === 'ArrowRight') next.click();
}
ifr.addEventListener('load', () => {
  let id = null;
  try { id = idOf(ifr.contentWindow.location.pathname); ifr.contentDocument.addEventListener('keydown', onKey); } catch (e) {}
  if (id && byId[id] && (!cur || id !== cur.id)) show(id, true);
});
prev.addEventListener('click', () => cur && cur.i > 0 && show(SCREENS[cur.i - 1].id));
next.addEventListener('click', () => cur && cur.i < SCREENS.length - 1 && show(SCREENS[cur.i + 1].id));
document.addEventListener('keydown', onKey);
window.addEventListener('resize', fit);
show(new URLSearchParams(location.search).get('s'));
