<div class="phone is-open" style="line-height: 1.5; text-size-adjust: 100%; tab-size: 4; font-feature-settings: normal; font-variation-settings: normal; -webkit-tap-highlight-color: transparent; font-family: Pretendard, sans-serif; color: #333333; letter-spacing: -1px; width: 390px; position: relative; overflow: hidden; isolation: isolate; background: #e9ecf5; flex-shrink: 0; height: 897px; box-shadow: none; border-radius: 0px; margin: 0px; zoom: 1;"><div class="app-window " style="position: absolute; inset: 0px; background: white; padding-top: 45px; padding-bottom: 27px; display: flex; flex-direction: column; z-index: 10; transform-origin: 14% 23%;"><div class="app-content  " style="min-height: 0px; overflow: hidden auto; flex: 1 1 0%; scrollbar-width: none; background: #ffffff; height: 878px; max-height: none;"><div class="login-page " style="padding: 50px 24px 26px;"><div class="login-brand" style="margin-bottom: 48px;"><div class="wordmark" style="color: #1219f7; font-size: 42px; font-weight: 900; letter-spacing: -3px; line-height: 1.2; display: flex; align-items: flex-end;"><svg class="concept-artwork concept-lockup" viewBox="0 0 146 48" role="img" aria-label="박스 이모부 가로형 로고" style="display: block; flex-shrink: 0; overflow: visible; width: 146px; height: 48px; max-width: none;"><g color="inherit"><g fill="none" stroke="currentColor" stroke-width="3.6" stroke-linejoin="round"><path d="M8 17 24 8l16 9v20L24 45 8 37Z" transform="translate(0 -3)"></path><path d="m8 14 16 9 16-9M24 23v19M16 10l16 9v8"></path></g></g><g transform="translate(57 8)"><g fill="none" stroke="currentColor" stroke-width="4.4" stroke-linecap="square" stroke-linejoin="miter"><ellipse cx="9" cy="13" rx="6.6" ry="8.4"></ellipse><path d="M23 3v27"></path><path d="M35 4h17v13H35ZM43.5 22v7M32 29h23"></path><path d="M66 3v15h17V3M66 10h17M63 24h23M74.5 24v8"></path></g></g></svg></div><p style="color: #666666; font-size: 14px; margin-top: 10px;">이사의 모든 것을 부탁해</p></div><div class="eyebrow" style="font-size: 12px; color: #1219f7; margin-bottom: 9px; font-weight: 600;">반가워요, 이모부예요</div><h1 style="font-size: 25px;">새로운 시작을 위한 이사,<br>함께 준비해요.</h1><p class="description" style="color: #666666; font-size: 14px; line-height: 1.65; margin-top: 12px; margin-bottom: 32px;">휴대폰 번호로 간편하게 시작하고<br>나에게 맞는 이사 견적을 받아보세요.</p><label class="field" style="display: flex; flex-direction: column; gap: 10px; margin: 20px 0px 16px;"><span style="font-size: 14px; font-weight: 600;">휴대폰 번호</span><input type="tel" placeholder="휴대폰 번호를 입력해 주세요" maxlength="13" value="010-1234-5678" style="border: 1px solid #ebeef2; border-radius: 8px; width: 100%; padding: 16px; font-size: 16px; background: #ffffff; color: #333333; transition: border 0.15s; height: 56px;"></label><div class="code-field" style="position: relative;"><label class="field" style="display: flex; flex-direction: column; gap: 10px; margin: 20px 0px 16px; position: relative;"><span style="font-size: 14px; font-weight: 600;">인증번호</span><input inputmode="numeric" maxlength="6" placeholder="인증번호 6자리" style="border: 1px solid #ebeef2; border-radius: 8px; width: 100%; padding: 16px 65px 16px 16px; font-size: 16px; background: #ffffff; color: #333333; transition: border 0.15s; height: 56px;"><a href="CA-LoginCodeFilled.html" aria-label="인증번호 입력" style="position: absolute; inset: 0px; z-index: 5; display: block; cursor: pointer;"></a></label><span style="position: absolute; bottom: 19px; right: 16px; color: #1219f7; font-size: 14px; letter-spacing: 0px;">3:00</span></div><div class="resend" style="display: flex; justify-content: flex-end; gap: 8px; font-size: 12px; margin: 10px 0px 20px; color: #888888;"><span>인증번호가 오지 않았나요?</span><a href="CA-LoginResend.html" style="color: #333333; text-decoration: underline; display: flex; text-align: center; cursor: pointer; flex-direction: column; justify-content: center; align-items: stretch;"><span style="display: block;">다시 받기</span></a></div><button class="button  " disabled="disabled" style="width:
