<style>

<body>
<main class="login-page" style="line-height: 1.5; text-size-adjust: 100%; tab-size: 4; font-feature-settings: normal; font-variation-settings: normal; -webkit-tap-highlight-color: transparent; font-family: Pretendard, -apple-system, BlinkMacSystemFont, sans-serif; color: #121212; letter-spacing: -1px; font-size: 15px; height: 100vh; display: grid; place-items: center; background-color: #ffffff;"><div class="login-box" style="width: 440px; display: flex; flex-direction: column;"><div class="logo-wrap large" style="display: flex; align-items: center; gap: 10px;"><svg class="logo" viewBox="0 0 146 48" role="img" aria-label="이모부" style="color: #1219f7; width: 110px; height: 36px;"><g fill="none" stroke="currentColor" stroke-width="3.6" stroke-linejoin="round"><path d="M8 17 24 8l16 9v20L24 45 8 37Z" transform="translate(0 -3)"></path><path d="m8 14 16 9 16-9M24 23v19M16 10l16 9v8"></path></g><g transform="translate(57 8)" fill="none" stroke="currentColor" stroke-width="4.4" stroke-linecap="square" stroke-linejoin="miter"><ellipse cx="9" cy="13" rx="6.6" ry="8.4"></ellipse><path d="M23 3v27M35 4h17v13H35ZM43.5 22v7M32 29h23M66 3v15h17V3M66 10h17M63 24h23M74.5 24v8"></path></g></svg><span class="admin-badge" style="padding: 4px 7px; background: #333333; color: #ffffff; border-radius: 6px; font-size: 11px; font-weight: 700;">관리자</span></div><div class="login-copy" style="margin: 44px 0px 34px;"><p style="margin: 0px 0px 8px; color: #1219f7; font-size: 13px; font-weight: 700;">이모부 관리자</p><h1 style="font-size: 32px; line-height: 1.35; margin: 0px 0px 12px; color: #333333; font-weight: 750;">신청부터 배정까지,<br>한 곳에서 관리해요.</h1><span style="color: #666666;">등록된 관리자 계정으로 로그인해 주세요.</span></div><label style="font-size: 14px; font-weight: 700; color: #333333; margin-bottom: 18px; position: relative;">아이디<input placeholder="아이디를 입력해 주세요" style="font: inherit; letter-spacing: inherit; display: block; width: 100%; height: 48px; border: 1px solid #ebeef2; border-radius: 8px; padding: 0px 14px; margin-top: 8px; outline: 0px;"><a href="AW-LoginFilled.html" aria-label="아이디 입력" style="position: absolute; inset: 0px; z-index: 5; display: block; cursor: pointer;"></a></label><label style="font-size: 14px; font-weight: 700; color: #333333; margin-bottom: 18px;">비밀번호<input type="password" placeholder="비밀번호를 입력해 주세요" style="font: inherit; letter-spacing: inherit; display: block; width: 100%; height: 48px; border: 1px solid #ebeef2; border-radius: 8px; padding: 0px 14px; margin-top: 8px; outline: 0px;"></label><label class="check" style="font-size: 14px; color: #333333; display: flex; align-items: center; gap: 8px; font-weight: 500; margin: 0px 0px 22px;"><input type="checkbox" style="font: inherit; letter-spacing: inherit; display: block; border: 1px solid #ebeef2; outline: 0px; appearance: none; width: 18px; height: 18px; margin: 0px; padding: 0px; border-radius: 5px;"> 자동 로그인</label><button class="primary" disabled="disabled" style="font-style: inherit; font-variant: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; letter-spacing: inherit; height: 48px; border: 0px; border-radius: 8px; color: #ffffff; font-size: 16px; font-weight: 700; padding: 0px 20px; cursor: not-allowed; background: #d7dbe2;">로그인</button><small style="text-align: center; color: #888888; font-size: 12px; margin-top: 38px;">이모부 관리자 전용</small></div></main>
