holder="아이디를 입력해 주세요" value="tuntun" style="font: inherit; letter-spacing: inherit; height: 52px; border: 1px solid #ebeef2; border-radius: 8px; padding: 0px 15px; outline: none; background: white;"><a href="PW-LoginFilled.html" aria-label="아이디 다시 입력" style="position: absolute; inset: 0px; z-index: 5; display: block; cursor: pointer;"></a></label><label style="display: flex; flex-direction: column; gap: 9px; font-size: 14px; font-weight: 700; color: #333333; margin-bottom: 19px;">비밀번호<input type="password" placeholder="비밀번호를 입력해 주세요" value="0000" style="font: inherit; letter-spacing: inherit; height: 52px; border: 1px solid #ebeef2; border-radius: 8px; padding: 0px 15px; outline: none; background: white;"></label><p class="error" style="font-size: 13px; color: #f04452; margin: -8px 0px 16px;">아이디 또는 비밀번호를 확인해 주세요</p><label class="check" style="font-size: 13px; color: #666666; display: flex; align-items: center; gap: 8px; margin: 0px 0px 20px;"><input type="checkbox" style="font: inherit; letter-spacing: inherit; border: 1px solid #ebeef2; border-radius: 8px; padding: 0px 15px; outline: none; background: white; width: 16px; height: 16px; accent-color: #1219f7;"> 자동 로그인</label><button class="primary login-button" style="font-style: inherit; font-variant: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variation-settings: inherit; font-language-override: inherit; letter-spacing: inherit; cursor: pointer; border: 0px; border-radius: 8px; font-weight: 650; transition: 0.15s; background: #1219f7; color: #ffffff; height: 52px; font-size: 16px;">로그인</button><button type="button" class="inquiry" style="font-style: inherit; font-variant: inherit; font-stretch: inherit; line-height: inherit; font-family: inherit; font-optical-sizing: inherit; font-size-adjust: inherit; font-kerning: inherit; font-feature-settings: inherit; font-variat
